<meta name="theme-color" content="#f5f5f7">
<meta name="application-name" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Daily">
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#86868b; --line:#e8e8ed;
  --green:#34c759; --green-soft:#eafaf0; --blue:#0071e3;
  --prot:#ff375f; --carb:#0a84ff; --fat:#ff9f0a;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.78);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:24px}
.logo{font-weight:600;font-size:19px;letter-spacing:-.02em}
.logo span{color:var(--green)}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px}
.seg button{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);transition:all .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
#viewSeg{position:relative}
#viewSeg button{position:relative;z-index:1}
#viewSeg button.on{background:transparent;box-shadow:none}
#viewSeg .pill{position:absolute;top:2px;bottom:2px;left:0;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transition:transform .5s cubic-bezier(.22,.61,.36,1),width .5s cubic-bezier(.22,.61,.36,1)}
.spacer{flex:1}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--muted);transition:background .2s}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

main{max-width:1240px;margin:0 auto;padding:28px 32px 60px}
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:20px}

/* Cabecera de día */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.datecard{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px}
.datecard .dtxt{flex:1}
.datecard .round{box-shadow:none;background:var(--bg)}
.datecard .round:hover{background:#ebebef}
.datecard .dtxt{min-width:250px;text-align:center}
.datecard h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.datecard .sub{color:var(--muted);font-size:14px;margin-top:1px}
.datecard .pill{box-shadow:none;background:var(--bg);font-size:13px}
.btn-blue{flex:none;align-self:stretch;display:flex;align-items:center;gap:8px;background:#0071e3;color:#fff;font-size:16px;font-weight:600;
  padding:14px 28px;border-radius:20px;box-shadow:0 4px 14px rgba(0,113,227,.3);transition:transform .2s,background .2s,box-shadow .2s}
.btn-blue:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,113,227,.35)}
.btn-blue:active{transform:scale(.97)}
.btn-blue #regIco{font-size:18px;line-height:1}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto 1fr;gap:24px;align-items:start}
.dash .dcol:first-child{grid-row:1 / span 2}
.dash .dcol:nth-child(2){grid-column:2;grid-row:1}
.dash .dcol:nth-child(3){grid-column:2;grid-row:2}
.dcol{display:flex;flex-direction:column;gap:24px;min-width:0}
.reg{max-width:920px;margin:0 auto;position:relative;padding-top:8px}
.regmode .topbar{display:none}
.regback{display:grid;place-items:center;width:44px;height:44px;margin:0 0 14px}
.regback svg{display:block}
.reg .crumbs{justify-content:center;position:relative}
.reg .crumbs .steps{position:absolute;right:0}
.reg .crumbs>.round{position:absolute;left:0}
.slide-in-r{animation:inRs .8s cubic-bezier(.22,.61,.36,1) both}
.slide-in-l{animation:inLs .8s cubic-bezier(.22,.61,.36,1) both}
.leave-l{animation:outL .38s cubic-bezier(.55,0,.6,.4) both;pointer-events:none}
.leave-r{animation:outR .38s cubic-bezier(.55,0,.6,.4) both;pointer-events:none}
.fade-in{animation:fadeIn .8s cubic-bezier(.22,.61,.36,1) both}
@keyframes inRs{from{opacity:0;transform:translateX(40px)}}
@keyframes inLs{from{opacity:0;transform:translateX(-40px)}}
@keyframes outL{to{opacity:0;transform:translateX(-30px)}}
@keyframes outR{to{opacity:0;transform:translateX(30px)}}
@keyframes fadeIn{from{opacity:0}}
.q-in-r{animation:qInR .38s cubic-bezier(.22,.61,.36,1) both}
.q-in-l{animation:qInL .38s cubic-bezier(.22,.61,.36,1) both}
.q-out-l{animation:qOutL .16s ease-in both;pointer-events:none}
.q-out-r{animation:qOutR .16s ease-in both;pointer-events:none}
.q-fade{animation:fadeIn .38s ease both}
@keyframes qInR{from{opacity:0;transform:translateX(24px)}}
@keyframes qInL{from{opacity:0;transform:translateX(-24px)}}
@keyframes qOutL{to{opacity:0;transform:translateX(-16px)}}
@keyframes qOutR{to{opacity:0;transform:translateX(16px)}}
.wo .wempty{color:var(--muted);font-size:14px;padding:18px 0 6px;text-align:center}
.wo .wempty div{font-size:34px;margin-bottom:6px}
.wohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wohead h3{margin:0!important;font-size:17px!important}
.btn-upd{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#0071e3;background:#eaf3ff;padding:7px 12px;border-radius:999px}
.btn-upd:hover{background:#dcebff}
.updnote{font-size:13px;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;line-height:1.45}
.updnote code{background:#fff;border-radius:6px;padding:1px 6px;font-weight:600}
.updnote button{color:#0071e3;font-weight:600;margin-left:4px}
@media (max-width:600px){ .dash{grid-template-columns:1fr;grid-template-rows:none} .dash .dcol{grid-column:auto!important;grid-row:auto!important} .topbar{flex-direction:column;align-items:stretch} .datecard .dtxt{min-width:0;flex:1} }
.dayhead h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.cap::first-letter{text-transform:uppercase}
.dayhead .sub{color:var(--muted);font-size:15px;margin-top:2px}
.nav-arrows{display:flex;gap:4px;margin-left:auto}
.pill{padding:7px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:14px;font-weight:500}
.pill:hover{background:#fafafa}
.round{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.round:hover{background:#fafafa}

/* Selector de comida */
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.meal{padding:16px 18px;border-radius:16px;background:#fff;box-shadow:var(--shadow);text-align:left;border:2px solid transparent;transition:all .2s}
.meal:hover{transform:translateY(-1px)}
.meal .mi{font-size:24px}
.meal .mn{font-weight:600;font-size:16px;margin-top:6px}
.meal .mk{color:var(--muted);font-size:13px;margin-top:2px}
.meal.on{border-color:var(--text);}

/* Buscador y categorías */
.searchbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(118,118,128,.12);border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;background:none;outline:none;padding:11px 0;font-size:15px}
.search span{color:var(--muted)}
.btn{padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;background:#fff;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.primary{background:var(--text);color:#fff;box-shadow:none}
.btn.primary:hover{background:#000}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;box-shadow:var(--shadow);white-space:nowrap;color:#424245}
.chip.on{background:var(--text);color:#fff}

.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 12px}

/* Recuadros de productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{position:relative;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:2px solid transparent;
  padding:16px;min-height:212px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;text-align:left}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.08)}
.tile .emo{font-size:40px;line-height:1;height:52px;display:flex;align-items:center}
.tile .emo img{width:52px;height:52px;object-fit:contain;border-radius:10px}
.tile .tn{font-weight:600;font-size:15px;margin-top:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tb{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tk{margin-top:auto;padding-top:10px;font-size:13px;color:var(--muted)}
.tile .tk b{color:var(--text);font-weight:600}
.tile .del-custom{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;color:var(--muted);font-size:14px;opacity:0}
.tile:hover .del-custom{opacity:1}
.tile .del-custom:hover{background:rgba(0,0,0,.06)}
.tile.sel{border-color:var(--green);box-shadow:0 0 0 4px rgba(52,199,89,.15),var(--shadow);cursor:default;transform:none}
.tile.sel .emo{font-size:28px;height:34px}
.tile.sel .emo img{width:34px;height:34px}
.tile.sel .tn{margin-top:6px;font-size:14px}
.gbox{margin-top:10px;display:flex;align-items:center;background:var(--green-soft);border-radius:10px;padding:0 10px}
.gbox input{width:100%;border:0;background:none;outline:none;font-size:20px;font-weight:600;padding:6px 0;-moz-appearance:textfield}
.gbox input::-webkit-outer-spin-button,.gbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gbox span{color:#248a3d;font-weight:600}
.calc{font-size:12px;color:var(--muted);margin-top:6px}
.calc b{color:var(--text)}
.addbtn{margin-top:10px;width:100%;padding:9px;border-radius:10px;background:var(--green);color:#fff;font-weight:600;font-size:14px}
.addbtn:hover{background:#2fb350}
.tile.new{border:2px dashed #d2d2d7;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--muted);gap:6px}
.tile.new:hover{border-color:var(--muted);color:var(--text)}
.tile.new .plus{font-size:30px;font-weight:300}
.empty{color:var(--muted);font-size:14px;padding:26px 0}
.offzone{margin-top:30px}
.spinner{width:18px;height:18px;border:2px solid #d2d2d7;border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pasos: momento > tipo > alimentos */
.picker{min-width:0;overflow:hidden;padding:4px 6px 20px;margin:-4px -6px 0}
.crumbs{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.crumbs h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.crumbs .path{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.crumbs .path button{font-weight:700;color:var(--muted);transition:color .2s}
.crumbs .path button:hover{color:var(--text)}
.crumbs .path i{color:#c7c7cc;font-style:normal;font-weight:400}
.steps{margin-left:auto;display:flex;gap:6px}
.steps span{width:7px;height:7px;border-radius:50%;background:#d2d2d7;transition:all .3s}
.steps span.on{background:var(--text);width:20px;border-radius:9px}
.stage.fwd{animation:qInR .34s cubic-bezier(.22,.61,.36,1) both}
.stage.back{animation:qInL .34s cubic-bezier(.22,.61,.36,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}}
.bigs{display:grid;gap:16px}
.bigs.m3{grid-template-columns:repeat(3,1fr)}
.bigs.m5{grid-template-columns:repeat(5,minmax(0,1fr))}
.bigs.m5 .big{padding:22px 16px;min-height:190px}
.bigs.m5 .bn{font-size:18px}
.crumbs .path button:last-of-type{color:var(--text)}
.big{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;text-align:left;display:flex;flex-direction:column;
  min-height:210px;border:2px solid transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s}
.big:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 2px 4px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.1)}
.big:active{transform:scale(.98)}
.big .bi{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--tint,#f5f5f7)}
.big .bn{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:auto;padding-top:18px}
.big .bs{font-size:13px;color:var(--muted);margin-top:3px}
.big.on{border-color:var(--text)}
.glist{overflow:hidden;padding:6px 0}
.grow{display:flex;align-items:center;gap:18px;width:100%;padding:14px 22px;text-align:left;transition:background .15s;position:relative}
.grow+.grow::before{content:"";position:absolute;top:0;left:88px;right:0;border-top:1px solid var(--line)}
.grow:hover{background:#fafafa}
.grow:active{background:#f2f2f4}

.foodbar{display:flex;gap:10px;margin-bottom:16px}

/* Resumen */
.summary{padding:24px}

.bv{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}

.btile span{font-size:12px;font-weight:600;color:var(--muted)}
.btile b{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.btile small{font-size:12px;color:var(--muted)}
.btile.in{background:#eaf3ff}.btile.in b{color:#0a64c9}

.bres{margin-top:10px!important}

.wname{font-size:15px;font-weight:600;margin-left:8px}
.wtop .wmeta{margin:6px 0 0}
.wkc{text-align:right;line-height:1}
.wkc b{font-size:26px;font-weight:700;letter-spacing:-.03em;color:#d9480f}
.wkc small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.wrow{padding:8px 2px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wn2{font-size:13px;font-weight:600}
.ws2{font-size:12px;color:var(--muted);margin-top:2px}

.bsep{border-top:1px solid var(--line);margin:16px 0 14px}
.wo h3.wtitle{font-size:15px;margin-top:4px}
.bnote{font-size:13px;color:var(--muted);margin-bottom:10px}
.link{color:var(--blue);font-weight:500}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:7px;background:#f0f0f2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s cubic-bezier(.22,.61,.36,1)}

.bbar i.in{background:var(--carb)}.bbar i.out{background:#ff7a45}

.mg.open .chev{transform:rotate(180deg)}
.mbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.mbody>*{overflow:hidden}
.mg.open .mbody{grid-template-rows:1fr}
.mbody .item:last-child{margin-bottom:8px}

/* Historial */
.hist{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.cal{padding:26px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.calhead h2{font-size:28px;font-weight:700;letter-spacing:-.03em}
.calhead .nav-arrows{margin-left:auto;align-items:center}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.wk div{text-align:center;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dc{aspect-ratio:1/0.92;border-radius:14px;padding:10px;display:flex;flex-direction:column;text-align:left;transition:background .15s;border:2px solid transparent;background:#fff}
.dc:hover{background:#f5f5f7}
.dc.out{opacity:.3}
.dc .dn{font-size:15px;font-weight:500;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin:-4px 0 0 -4px}
.dc.today .dn{background:#ff3b30;color:#fff;font-weight:600}
.dc.sel{border-color:var(--text)}
.dc .dk{margin-top:auto;font-size:12px;font-weight:600}
.dc .dk small{font-weight:400;color:var(--muted)}
.dc .db{height:4px;border-radius:9px;background:#f0f0f2;margin-top:5px;overflow:hidden}
.dc .db i{display:block;height:100%;border-radius:9px}
.legend{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:var(--bg);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.dtitle{padding:22px 22px 0}
.dtitle h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.dtitle p{color:var(--muted);font-size:14px;margin-top:2px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;animation:fade .2s}
.modal{width:440px;max-width:calc(100vw - 32px);padding:28px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.modal h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.modal p.s{color:var(--muted);font-size:14px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#424245}
.field{min-width:0}
.field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field input,.field select{width:100%;min-width:0;border:1px solid #d2d2d7;border-radius:10px;padding:10px 12px;outline:none;font-size:15px;background:#fff}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.modal{max-height:calc(100vh - 40px);overflow-y:auto}
.calcm{display:flex;flex-direction:column;gap:14px;margin-bottom:6px}
.rng .rl{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:#424245;margin-bottom:6px}
.rng .rl b{color:var(--text)}
.rng input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:9px;background:#e8e8ed;outline:none}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.rng input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#424245}
.mcell b{margin-left:auto;font-size:16px;color:var(--text)}
.mwarn{grid-column:1/-1;font-size:13px;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.seg.tabs{display:flex;width:100%;margin-bottom:22px}
.seg.tabs button{flex:1;padding:7px 0}
.tabp{min-height:330px}
.tabp.fwd{animation:inR .4s cubic-bezier(.2,.8,.2,1)}
.tabp.back{animation:inL .4s cubic-bezier(.2,.8,.2,1)}
.modal{overflow-x:hidden}
.msep{border-top:1px solid var(--line);margin:8px 0 20px}
.sexseg{display:flex;width:100%;padding:2px}
.sexseg label{flex:1;position:relative}
.sexseg input{position:absolute;opacity:0;pointer-events:none}
.sexseg span{display:block;text-align:center;padding:8px 0;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.sexseg input:checked+span{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tmb{font-size:13px;color:var(--muted);margin:-4px 0 6px;min-height:18px}
.tmb b{color:var(--text)}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.mlinks{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.92);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .calhead{flex-wrap:wrap;margin-bottom:12px}

}

<script>
/* ---------- Datos ---------- */
const LS = 'nutri.v1';
const MEALS = [
  {id:'comida', name:'Comida', icon:'🍽️'},
  {id:'snack',  name:'Snack',  icon:'🥨'},
  {id:'cena',   name:'Cena',   icon:'🌙'},
];
const GROUPS = [
  {id:'Proteína',     icon:'🍗', tint:'#ffeef1'},
  {id:'Carbohidrato', icon:'🍝', tint:'#eaf3ff'},
  {id:'Fruta',        icon:'🍎', tint:'#eafaf0'},
  {id:'Verdura',      icon:'🥦', tint:'#eef8e6'},
  {id:'Salsa',        icon:'🍅', tint:'#fff4e5'},
];
const BASE = ALIMENTOS.map((a,i)=>({id:'b'+i, ...a}));

let db = load();
function load(){
  const def = {days:{}, custom:[], recent:[], goal:{k:2000,p:120,c:230,g:65}, profile:{peso:'',altura:'',edad:'',sexo:'',pkg:1.8,gkg:0.9}};
  try { const d = JSON.parse(localStorage.getItem(LS)||'{}'); return {...def, ...d, goal:{...def.goal, ...(d.goal||{})}}; }
  catch(e){ return def; }
}
function save(){ localStorage.setItem(LS, JSON.stringify(db)); }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const todayKey = () => keyOf(new Date());
const nf0 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
const fk = n => nf0.format(Math.round(n||0));
const fm = n => (n||0) < 10 ? nf1.format(n||0) : nf0.format(Math.round(n||0));
const FMT = {k:fk, m:fm};
const N = (key, v, f='k') => `<span data-n="${key}" data-v="${+v||0}" data-f="${f}">${FMT[f](v)}</span>`;
// Re-renderiza y anima barras, anillo y números desde su valor anterior
function animSwap(fn){
  const pw={}, pn={};
  $('#viewHoy').querySelectorAll('[data-a]').forEach(e=>{ pw[e.dataset.a] = e.style.width || e.style.strokeDashoffset; });
  $('#viewHoy').querySelectorAll('[data-n]').forEach(e=>{ pn[e.dataset.n] = +e.dataset.v; });
  fn();
  const els = [...$('#viewHoy').querySelectorAll('[data-a]')].filter(e=>pw[e.dataset.a]!=null);
  const tgt = els.map(e=>{ const ring = e.tagName.toLowerCase()==='circle'; const t = ring ? e.getAttribute('stroke-dashoffset') : e.style.width;
    e.style.transition='none'; if (ring) e.style.strokeDashoffset = pw[e.dataset.a]; else e.style.width = pw[e.dataset.a]; return [e,ring,t]; });
  if (els.length){ void document.body.offsetWidth;
    tgt.forEach(([e,ring,t])=>{ e.style.transition=''; if (ring) e.style.strokeDashoffset = /px$/.test(t)?t:t+'px'; else e.style.width = t; }); }
  $('#viewHoy').querySelectorAll('[data-n]').forEach(e=>{
    const from = pn[e.dataset.n], to = +e.dataset.v, f = FMT[e.dataset.f]||fk;
    if (from==null || from===to) return;
    const t0 = performance.now(), D = 900;
    const step = now=>{ if (!e.isConnected) return; const x = Math.max(0,Math.min(1,(now-t0)/D)), ease = 1-Math.pow(1-x,3);
      e.textContent = f(from + (to-from)*ease); if (x<1) requestAnimationFrame(step); };
    e.textContent = f(from); requestAnimationFrame(step);
  });
}
const fmtDay = k => new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(dateOf(k));
function addDays(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function defaultMeal(){ const h=new Date().getHours(); return h<16?'comida':h<20?'snack':'cena'; }
const qtyToGrams = (p,q) => p.u ? q*p.u : q;
const calcLine = v => `<b>${fk(v.k)} kcal</b> · P ${fm(v.p)} · C ${fm(v.c)} · G ${fm(v.g)}`;
function calc(prod, grams){ const f=(grams||0)/100; return {k:prod.k*f, p:prod.p*f, c:prod.c*f, g:prod.g*f}; }
function emoHTML(p){ return p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${p.e||'🍽️'}'))">` : esc(p.e||'🍽️'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }

function dayData(k){ return db.days[k] || {comida:[],snack:[],cena:[]}; }
function totals(k, meal){
  const d = dayData(k); const t={k:0,p:0,c:0,g:0};
  (meal?[meal]:MEALS.map(m=>m.id)).forEach(m => (d[m]||[]).forEach(e => { const v=calc(e.prod,e.grams); t.k+=v.k;t.p+=v.p;t.c+=v.c;t.g+=v.g; }));
  return t;
}

/* ---------- Estado de la interfaz ---------- */
const ui = { view:'hoy', date:todayKey(), meal:defaultMeal(), step:1, group:null, q:'', sel:null, off:[], offState:'', offQ:'',

function ringSVG(t, goal, size=132, stroke=12, key){
  const r=(size-stroke)/2, C=2*Math.PI*r, pct=Math.min(t/goal,1), over=t>goal*1.1;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f0f0f2" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over?'var(--fat)':'var(--green)'}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"${key?` data-a="${key}" style="stroke-dashoffset:${C*(1-pct)}px"`:''}/></svg>`;
}

    <div class="bar"><i data-a="b${id}" style="width:${Math.min(v/goal*100,100)}%;background:${color}"></i></div></div>`;
  return `<div class="ringwrap">
      <div class="ring">${ringSVG(t.k,G.k,132,12,'ring')}<div class="c"><b>${N('tk',t.k)}</b><span>de ${fk(G.k)} kcal</span></div></div>
      <div class="rest">${left>=0?'Te quedan':'Te has pasado'}<b>${N('left',Math.abs(left))} kcal</b>${N('pct',t.k/G.k*100)} % del objetivo</div>
    </div>
    <div class="macros">
      ${macro('Proteína','var(--prot)',t.p,G.p,'p')}
      ${macro('Carbohidratos','var(--carb)',t.c,G.c,'c')}
      ${macro('Grasa','var(--fat)',t.g,G.g,'g')}
    </div>
    ${+(db.profile||{}).peso ? `<div class="crea"><i class="dot" style="background:#af52de"></i>Creatina recomendada<b>${nf1.format(+db.profile.peso/10)} g/día</b></div>` : ''}`;
}

/* ---------- Balance: déficit / superávit ---------- */
const GYM = [
  {id:'',        name:'Sin gimnasio', met:0},
  {id:'fuerza',  name:'Fuerza (pesas)', met:5},
  {id:'fuerzai', name:'Fuerza intensa', met:6},
  {id:'cardio',  name:'Cardio moderado', met:7},
  {id:'hiit',    name:'HIIT / cardio intenso', met:8},
];
const nf2 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
/* ---------- Gasto del entreno, serie a serie ----------
   Para cada repetición: trabajo mecánico = carga efectiva × g × recorrido (m).
   · carga efectiva = peso de la serie (×2 en mancuernas a dos brazos) + la parte de tu peso corporal que mueve el ejercicio
     (dominada ≈ 95 %, fondos ≈ 90 %, sentadilla ≈ 85 %, flexión ≈ 65 %…; en máquinas y poleas, 0 %).
   · el músculo convierte ~20 % de la energía en trabajo; la fase excéntrica y la estabilización suman ~30 % más.
   Además: esfuerzo isométrico durante cada serie (~3 s por repetición, 3 MET netos), descansos entre series
   (resto de la duración del entreno, 1,5 MET netos) y post-quemado (EPOC, +15 %).
   Todo es gasto NETO por encima del metabolismo basal, que ya se cuenta aparte. */
const EX = [
  // [patrón, recorrido m, fracción del peso corporal, nombre del tipo]
  [/dominada|pull ?up|chin ?up/,                 0.60, 0.95, 'tirón con peso corporal'],
  [/fondo|dip/,                                  0.45, 0.90, 'empuje con peso corporal'],
  [/flexion|push ?up/,                           0.35, 0.65, 'empuje con peso corporal'],
  [/sentadilla|squat/,                           0.60, 0.85, 'pierna compuesto'],
  [/zancada|lunge|bulgara|split/,                0.50, 0.85, 'pierna compuesto'],
  [/peso muerto|deadlift/,                       0.55, 0.40, 'cadena posterior'],
  [/prensa|leg press|hack/,                      0.50, 0.10, 'pierna en máquina'],
  [/hip thrust|puente/,                          0.30, 0.30, 'glúteo'],
  [/gemelo|pantorrilla|calf/,                    0.10, 0.85, 'gemelo'],
  [/extension de pierna|cuadriceps|leg extension/,0.45,0,   'pierna aislado'],
  [/curl femoral|isquio|leg curl/,               0.40, 0,    'pierna aislado'],
  [/press de banca|bench|press inclinado|press declinado/, 0.45, 0, 'empuje compuesto'],
  [/press de pecho|chest press/,                 0.40, 0,    'empuje en máquina'],
  [/mariposa|pec deck|apertura|cruce|fly/,       0.35, 0,    'pecho aislado'],
  [/press de hombro|press militar|overhead|arnold/, 0.50, 0, 'empuje vertical'],
  [/elevacion lateral|elevacion frontal|pajaro|lateral raise/, 0.45, 0, 'hombro aislado'],
  [/tiron a la cara|face pull/,                  0.40, 0,    'hombro posterior'],
  [/jalon|pulldown/,                             0.60, 0,    'tirón vertical en polea'],
  [/remo|row/,                                   0.40, 0,    'tirón horizontal'],
  [/curl/,                                       0.35, 0,    'bíceps'],
  [/frances|triceps|skull|extension/,            0.35, 0,    'tríceps'],
  [/abdominal|crunch|encogimiento/,              0.20, 0.30, 'core'],
];
function exInfo(name){ const n = norm(name);
  const m = EX.find(([re])=>re.test(n)) || [null, 0.40, 0, 'general'];
  const dbl = /mancuerna|dumbbell/.test(n) && !/un brazo|unilateral|una mano|alterno/.test(n);
  return {rom:m[1], bw:m[2], tipo:m[3], dbl}; }
// Intensidad (RIR = repeticiones en reserva). Ir al fallo (RIR 0):
//  · las últimas repeticiones son más lentas → más tiempo bajo tensión (3 s → 3,6 s por rep.)
//  · se reclutan más fibras y la eficiencia cae por la fatiga → +15 % de coste por repetición
//  · más trabajo anaeróbico → más esfuerzo durante la serie (3 → 4,5 MET netos) y más post-quemado (12 % → 24 %)
function rirFx(rir){ const f = 3 - Math.min(3, Math.max(0, +rir||0));   // 3 = fallo, 0 = RIR 3 o más
  return {tempo: 3 + 0.2*f, mech: 1 + 0.05*f, met: 3 + 0.5*f, epoc: 0.12 + 0.04*f}; }
function workoutKcal(w, peso, rir){
  peso = peso || 75; let mech = 0, reps = 0; const porEj = [];
  const F = rirFx(rir ?? (db.profile||{}).rir ?? 0);
  for (const [name, sets] of w.ejercicios){
    const x = exInfo(name); let e = 0;
    for (const [kg, r] of sets){
      const carga = (+kg||0) * (x.dbl?2:1) + x.bw * peso;
      e += r * carga * 9.81 * x.rom * 1.3 * F.mech / (0.20 * 4184); reps += r;
    }
    const activo = sets.reduce((t,[,r])=>t+r,0) * F.tempo / 3600 * F.met * peso;   // esfuerzo isométrico durante la serie
    porEj.push({name, tipo:x.tipo, kcal:e+activo}); mech += e;
  }
  const activoH = reps*F.tempo/3600, esfuerzo = F.met*peso*activoH;
  const descanso = 1.5 * peso * Math.max(0, w.min/60 - activoH);
  const base = mech + esfuerzo + descanso, epoc = base*F.epoc;
  return {mech, esfuerzo, descanso, epoc, total: base+epoc, porEj};
}
function hevyOf(k){ return (window.HEVY||[]).filter(w=>w.fecha===k); }
function fmtMin(m){ const h=Math.floor(m/60), r=m%60; return h ? `${h} h ${r} min` : `${r} min`; }
// Tipo de entreno: Push / Pull / Hombro (por el nombre o, si no, por los ejercicios)
function woType(w){
  const n = norm(w.nombre);
  if (/hombro|shoulder/.test(n)) return 'Hombro'; if (/push|empuje/.test(n)) return 'Push'; if (/pull|tiron|espalda/.test(n)) return 'Pull';
  let c = {Push:0, Pull:0, Hombro:0};
  for (const [name] of w.ejercicios){ const e = norm(name);
    if (/press de hombro|press militar|overhead|arnold|elevacion lateral|elevacion frontal|pajaro|tiron a la cara|face pull/.test(e)) c.Hombro++;
    else if (/remo|jalon|pulldown|dominada|curl|pullover/.test(e)) c.Pull++;
    else c.Push++; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
function setsTxt(ss){
  const same = ss.every(([kg])=>kg===ss[0][0]);
  return same ? `<b>${nf2.format(ss[0][0])} kg</b> × ${ss.map(([,r])=>r).join(' · ')}`
              : ss.map(([kg,r])=>`<b>${nf2.format(kg)}</b>×${r}`).join(' · ');
}
function workoutHTML(k){
  const ws = hevyOf(k); if (!ws.length) return '';
  const peso = +(db.profile||{}).peso || 75;
  return ws.map(w=>{ const K = workoutKcal(w, peso), t = woType(w);
    return `<div class="wtop"><div><span class="wtype ${t.toLowerCase()}">${t}</span>${norm(w.nombre)!==norm(t)?`<span class="wname">${esc(w.nombre)}</span>`:''}
        <div class="wmeta">⏱ ${fmtMin(w.min)} · ${w.ejercicios.length} ejercicios</div></div>
      <div class="wkc"><b>${fk(K.total)}</b><small>kcal</small></div></div>
    <div class="wlist">${w.ejercicios.map(([n,ss])=>`<div class="wrow"><div class="wn2">${esc(n)}</div><div class="ws2">${setsTxt(ss)}</div></div>`).join('')}</div>`; }).join('<hr>');
}
function woCardHTML(k){
  const has = hevyOf(k).length;
  const a = actOf(k), r = balanceCalc(k);
  return `<div class="wohead"><h3>Entrenamiento</h3></div>
    <label class="wtop wsteps"><div><span class="wtype pasos">👟 Pasos</span><div class="wmeta">Pasos del día</div></div>
      <input type="number" min="0" step="100" data-act="pasos" value="${esc(a.pasos)}" placeholder="0">
      <div class="wkc"><b id="pasosK">${r.ok?fk(r.pasos):'–'}</b><small>kcal</small></div></label>
    ${has ? workoutHTML(k) : `<div class="wempty"><div>🏋️</div>Sin entreno registrado este día.</div>`}`;
}
function actOf(k){ return (db.days[k] && db.days[k].act) || {pasos:'', gym:'', min:''}; }
function balanceCalc(k){
  const P = db.profile||{}, peso = +P.peso, b = bmr(P), a = actOf(k), ing = totals(k).k;
  if (!b) return {ok:false, ing};
  const pasos = (+a.pasos||0) * peso * 0.0005;                 // ≈ 0,04 kcal por paso con 75 kg
  const hv = hevyOf(k), g = GYM.find(x=>x.id===(a.gym||'')) || GYM[0];
  const gym = hv.length ? hv.reduce((t,w)=>t+workoutKcal(w,peso).total,0)   // entreno de Hevy, serie a serie
                        : Math.max(0,g.met-1) * peso * ((+a.min||0)/60);       // MET neto (sin el basal) × kg × horas
  const gasto = b + pasos + gym;
  return {ok:true, ing, b, pasos, gym, gasto, diff: ing - gasto};
}
function balResHTML(k){
  const r = balanceCalc(k);
  if (!r.ok) return `<div class="bnote">Rellena peso, altura, edad y sexo en <button class="link" id="goSettings">Ajustes</button> para calcular tu gasto.</div>`;
  const def = r.diff < 0, mx = Math.max(r.ing, r.gasto, 1);
  return `<div class="bline"><span class="bi2 in">🍽️</span><div class="bl"><b>Calorías consumidas</b><small>Comida, cena y snack</small><div class="bbar"><i class="in" data-a="bin" style="width:${r.ing/mx*100}%"></i></div></div><div class="bv">${N('bing',r.ing)} <small>kcal</small></div></div>
    <div class="bline"><span class="bi2 out">🔥</span><div class="bl"><b>Calorías gastadas</b><small title="Basal ${fk(r.b)} · pasos ${fk(r.pasos)} · entreno ${fk(r.gym)}">Basal + pasos + entreno</small><div class="bbar"><i class="out" data-a="bout" style="width:${r.gasto/mx*100}%"></i></div></div><div class="bv">${N('bgas',r.gasto)} <small>kcal</small></div></div>
    <div class="bres ${def?'def':'sup'}"><span>${def?'Déficit calórico':'Superávit calórico'}</span><b>${def?'−':'+'}${N('bdif',Math.abs(r.diff))} kcal</b></div>`;
}
function balanceHTML(k, editable){
  return `<h3>Balance del día</h3><div class="bout">${balResHTML(k)}</div>`;
}
function setAct(field, val){
  const day = db.days[ui.date] = dayData(ui.date);
  day.act = {...actOf(ui.date), [field]: val}; save();
  if (field==='gym'){ const m=document.querySelector('[data-act=min]'); m.disabled=!val; if(val && !m.value){ m.value=60; day.act.min='60'; save(); } }
  animSwap(()=>{ document.querySelector('#bal .bout').innerHTML = balResHTML(ui.date); });
  const pk = $('#pasosK'); if (pk){ const r = balanceCalc(ui.date); pk.textContent = r.ok ? fk(r.pasos) : '–'; }
}

let regBusy=false;
function openReg(on){
  if (regBusy || ui.reg===on) return; regBusy=true;
  const show = on ? $('#reg') : $('#dash'), hide = on ? $('#dash') : $('#reg');
  const tb = $('#viewHoy .topbar'), back = $('#regBack');
  const outCls = on ? 'q-out-l' : 'q-out-r';
  hide.classList.add(outCls); if (on) tb.classList.add(outCls); else back.classList.add(outCls);
  setTimeout(()=>{
    hide.classList.remove(outCls); tb.classList.remove(outCls); back.classList.remove(outCls);
    ui.reg = on; ui.sel = null;
    if (on){ ui.step = 1; ui.q=''; renderPicker(); }
    else setTimeout(renderSide, 120);
    $('#viewHoy').classList.toggle('regmode', on);
    hide.classList.add('hidden'); show.classList.remove('hidden','slide-in-r','slide-in-l','q-in-r','q-in-l');
    tb.classList.remove('fade-in','q-fade'); back.classList.remove('fade-in','q-fade');
    void show.offsetWidth; show.classList.add(on ? 'q-in-r' : 'q-in-l');
    (on ? back : tb).classList.add('q-fade');
    renderRegBtn(); window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(()=>{ regBusy=false; }, 120);
  }, 160);
}

function addEntry(){
  const p = lookup.get(ui.sel); if (!p) return;
  const q = Math.max(0, Number(document.querySelector('.tile.sel .gin')?.value || 0));
  if (!q){ toast(p.u?'Introduce las unidades':'Introduce los gramos'); return; }
  const grams = qtyToGrams(p,q);
  const prod = {n:p.n, e:p.e, k:+p.k, p:+p.p, c:+p.c, g:+p.g}; if (p.img) prod.img=p.img; if (p.marca) prod.marca=p.marca; if (p.u) prod.u=p.u; if (p.ul) prod.ul=p.ul;
  const day = db.days[ui.date] = dayData(ui.date);
  day[ui.meal] = day[ui.meal]||[]; day[ui.meal].push(p.u?{prod, grams, units:q, at:Date.now()}:{prod, grams, at:Date.now()});
  db.recent = [{...p}, ...db.recent.filter(r=>r.id!==p.id)].slice(0,24);
  save();
  ui.sel=null; ui.selGrams=null;
  toast(`${p.n} · ${p.u?nf1.format(q)+(p.ul?' cda':' ud'):fk(grams)+' g'} añadido a ${MEALS.find(m=>m.id===ui.meal).name}`);
  renderGrid(); renderSide();
}

  const cats = GROUPS.map(g=>g.id);
  openModal(`<h2>Nuevo producto</h2><p class="s">Copia los valores de la etiqueta (por cada 100 g).</p>
    <form id="fNew">
      <div class="row2"><div class="field"><label>Nombre</label><input name="n" required placeholder="Ej. Yogur de coco"></div>
      <div class="field"><label>Marca (opcional)</label><input name="marca"></div></div>
      <div class="row2"><div class="field"><label>Emoji</label><input name="e" value="🍽️" maxlength="4"></div>
      <div class="field"><label>Categoría</label><select name="cat">${cats.map(c=>`<option ${c===ui.group?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
      <div class="row4">
        <div class="field"><label>Kcal</label><input name="k" type="number" step="any" min="0" required></div>
        <div class="field"><label>Proteína</label><input name="p" type="number" step="any" min="0" value="0"></div>
        <div class="field"><label>Hidratos</label><input name="c" type="number" step="any" min="0" value="0"></div>
        <div class="field"><label>Grasa</label><input name="g" type="number" step="any" min="0" value="0"></div>
      </div>
      <div class="field"><label>Peso por unidad en g (opcional)</label><input name="u" type="number" step="any" min="0" placeholder="Rellénalo para registrar por unidades, ej. 125"></div>
      <div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Guardar</button></div>
    </form>`);
  $('#fNew').onsubmit = ev => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
    const p = {id:'c'+Date.now(), n:f.n.trim(), e:f.e||'🍽️', cat:f.cat, k:+f.k, p:+f.p, c:+f.c, g:+f.g}; if (f.marca.trim()) p.marca=f.marca.trim(); if (+f.u>0) p.u=+f.u;
    db.custom.unshift(p); save(); closeModal(); ui.group=p.cat; ui.step=3; ui.q=''; ui.sel=p.id; ui.selGrams=null; ui.focusGrams=true;
    renderPicker(); toast('Producto guardado'); };
}
function settingsModal(){
  const G=db.goal, P=db.profile||{};
  openModal(`<form id="fGoal">
      <div class="seg tabs" id="setTabs"><button type="button" data-tab="0" class="on">Tus datos</button><button type="button" data-tab="1">Calculadora</button><button type="button" data-tab="2">Objetivos</button></div>
      <div class="tabp" data-p="0">
      <h2>Tus datos</h2><p class="s">Peso, edad, sexo y altura.</p>
      <div class="row2">
        <div class="field"><label>Peso (kg)</label><input name="peso" type="number" min="1" step="0.1" value="${esc(P.peso??'')}" placeholder="Ej. 75"></div>
        <div class="field"><label>Altura (cm)</label><input name="altura" type="number" min="1" step="1" value="${esc(P.altura??'')}" placeholder="Ej. 178"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Edad (años)</label><input name="edad" type="number" min="1" step="1" value="${esc(P.edad??'')}" placeholder="Ej. 25"></div>
        <div class="field"><label>Sexo</label><div class="seg sexseg">
          <label><input type="radio" name="sexo" value="hombre" ${P.sexo==='hombre'?'checked':''}><span>Hombre</span></label>
          <label><input type="radio" name="sexo" value="mujer" ${P.sexo==='mujer'?'checked':''}><span>Mujer</span></label>
        </div></div>
      </div>
      <div class="field"><label>Intensidad de tus series</label><select name="rir">
        ${[[0,'Al fallo (RIR 0): no puedo hacer ni una más'],[1,'RIR 1: me guardo 1 repetición'],[2,'RIR 2: me guardo 2 repeticiones'],[3,'RIR 3 o más']].map(([v,t])=>`<option value="${v}" ${(+(P.rir??0))===v?'selected':''}>${t}</option>`).join('')}
      </select></div>
      <div class="tmb" id="tmb"></div>
      </div>
      <div class="tabp hidden" data-p="1">
      <h2>Calculadora de macros</h2><p class="s">Según tu peso y las calorías de la pestaña Objetivos. Los hidratos son el resto de calorías.</p>
      <div class="calcm">
        <div class="rng"><div class="rl"><span>Proteína</span><b><output id="pkgOut"></output> g/kg</b></div>
          <input type="range" name="pkg" min="1.6" max="2" step="0.1" value="${P.pkg??1.8}"></div>
        <div class="rng"><div class="rl"><span>Grasa</span><b><output id="gkgOut"></output> g/kg</b></div>
          <input type="range" name="gkg" min="0.8" max="1" step="0.05" value="${P.gkg??0.9}"></div>
        <div class="mres" id="mres"></div>
        <button type="button" class="btn green" id="applyMacros" style="width:100%">Usar estos valores como objetivo</button>
      </div>
      </div>
      <div class="tabp hidden" data-p="2">
      <h2>Objetivos diarios</h2><p class="s">Se usan para los anillos, las barras y el calendario.</p>
      <div class="field"><label>Calorías (kcal)</label><input name="k" type="number" min="1" value="${G.k}"></div>
      <div class="row2" style="grid-template-columns:1fr 1fr 1fr">
        <div class="field"><label>Proteína (g)</label><input name="p" type="number" min="1" value="${G.p}"></div>
        <div class="field"><label>Hidratos (g)</label><input name="c" type="number" min="1" value="${G.c}"></div>
        <div class="field"><label>Grasa (g)</label><input name="g" type="number" min="1" value="${G.g}"></div>
      </div>
      </div>
      <div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Guardar</button></div>
    </form>
    <div class="mlinks"><button class="btn" id="exp">Exportar copia</button><button class="btn" id="imp">Importar copia</button></div>`);
  $('#fGoal').onsubmit = ev => { ev.preventDefault(); const f=Object.fromEntries(new FormData(ev.target));
    db.goal = {k:+f.k||2000, p:+f.p||120, c:+f.c||230, g:+f.g||65};
    db.profile = {peso:f.peso, altura:f.altura, edad:f.edad, sexo:f.sexo||'', pkg:+f.pkg, gkg:+f.gkg, rir:+f.rir};
    save(); closeModal(); renderAll(); toast('Ajustes guardados'); };
  let last=null;
  const upd = () => { const f=Object.fromEntries(new FormData($('#fGoal'))); const b=bmr(f);
    $('#tmb').innerHTML = b ? `Metabolismo basal estimado: <b>${fk(b)} kcal/día</b>` : '';
    $('#pkgOut').textContent = nf1.format(+f.pkg); $('#gkgOut').textContent = new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(+f.gkg);
    last = macroCalc(+f.peso, +f.k, +f.pkg, +f.gkg);
    const box=$('#mres'), btn=$('#applyMacros');
    if (!last){ box.innerHTML = `<div class="mwarn">Introduce tu peso y las calorías objetivo para calcularlo.</div>`; btn.disabled=true; return; }
    box.innerHTML = `<div class="mcell"><i class="dot" style="background:var(--prot)"></i><span>Proteína</span><b>${fk(last.p)} g</b></div>
      <div class="mcell"><i class="dot" style="background:var(--fat)"></i><span>Grasa</span><b>${fk(last.g)} g</b></div>
      <div class="mcell"><i class="dot" style="background:var(--carb)"></i><span>Carbohidratos</span><b>${fk(last.c)} g</b></div>
      <div class="mcell"><i class="dot" style="background:#af52de"></i><span>Creatina</span><b>${nf1.format(last.cr)} g</b></div>
      ${last.c<0?'<div class="mwarn">Con estas calorías no quedan hidratos: sube las calorías objetivo.</div>':''}`;
    btn.disabled = last.c<0; };
  $('#applyMacros').onclick = () => { if(!last) return; const f=$('#fGoal');
    f.p.value=Math.round(last.p); f.g.value=Math.round(last.g); f.c.value=Math.round(last.c); setTab(2); toast('Valores aplicados. Pulsa Guardar.'); };
  $('#fGoal').addEventListener('input', upd); upd();
  $('#exp').onclick = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
    a.download='nutri-copia-'+todayKey()+'.json'; a.click(); };
  $('#imp').onclick = () => { const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
    i.onchange = async () => { try{ const d=JSON.parse(await i.files[0].text()); if(!d.days) throw 0; db={...load(),...d}; save(); closeModal(); renderAll(); toast('Copia importada'); }catch(e){ toast('Archivo no válido'); } };
    i.click(); };
}

// Calculadora: proteína y grasa por kilo; hidratos = resto de calorías; creatina 1 g por cada 10 kg
function macroCalc(peso, kcal, pkg, gkg){ if(!peso||!kcal) return null;
  const p=peso*pkg, g=peso*gkg, c=(kcal - p*4 - g*9)/4; return {p, g, c, cr:peso/10}; }
function setTab(n){
  const cur = +($('#setTabs .on')?.dataset.tab||0); if (cur===n) return;
  document.querySelectorAll('#setTabs [data-tab]').forEach(b=>b.classList.toggle('on', +b.dataset.tab===n));
  document.querySelectorAll('.tabp').forEach(pn=>{ const show = +pn.dataset.p===n; pn.classList.toggle('hidden', !show);
    pn.classList.remove('fwd','back'); if (show){ void pn.offsetWidth; pn.classList.add(n>cur?'fwd':'back'); } });
}
// Metabolismo basal (fórmula de Mifflin-St Jeor)
function bmr(f){ const w=+f.peso, h=+f.altura, a=+f.edad; if(!w||!h||!a||!f.sexo) return 0;
  return 10*w + 6.25*h - 5*a + (f.sexo==='hombre' ? 5 : -161); }

/* ---------- Historial ---------- */
function renderHist(){
  const m = ui.month, y=m.getFullYear(), mo=m.getMonth();
  $('#calTitle').textContent = new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(m);
  const start = new Date(y,mo,1); start.setDate(1 - ((start.getDay()+6)%7));
  const t = todayKey(); let html=''; const logged=[];
  for (let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const k=keyOf(d);
    if (i>=35 && d.getMonth()!==mo) break;
    const tt = totals(k), has = tt.k>0, pct = tt.k/db.goal.k;
    if (has && d.getMonth()===mo) logged.push(tt);
    const col = pct>1.1 ? 'var(--fat)' : pct>=0.9 ? 'var(--green)' : '#c7c7cc';
    html += `<button class="dc ${d.getMonth()!==mo?'out':''} ${k===t?'today':''} ${k===ui.calSel?'sel':''}" data-day="${k}">
      <span class="dn">${d.getDate()}</span>${hevyOf(k).length?'<span class="dgym" title="Entreno">🏋️</span>':''}
      ${has?`<span class="dk">${fk(tt.k)} <small>kcal</small></span><span class="db"><i style="width:${Math.min(pct*100,100)}%;background:${col}"></i></span>`:''}
    </button>`;
  }
  $('#days').innerHTML = html;
  const n=logged.length, avg = k => n ? logged.reduce((s,x)=>s+x[k],0)/n : 0;
  const inGoal = logged.filter(x=>x.k>=db.goal.k*0.9 && x.k<=db.goal.k*1.1).length;
  $('#stats').innerHTML = `<div class="stat"><b>${n}</b><span>días registrados</span></div>
    <div class="stat"><b>${fk(avg('k'))}</b><span>kcal de media</span></div>
    <div class="stat"><b>${inGoal}</b><span>días en objetivo</span></div>`;
  renderDetail();
}
function renderDetail(){
  const k = ui.calSel, has = totals(k).k>0;
  $('#detail').innerHTML = `<div class="dtitle"><h2 class="cap">${esc(fmtDay(k))}</h2><p>${dateOf(k).getFullYear()}</p></div>
    <div class="summary">${summaryHTML(k)}</div>
    <div class="bal" style="border-top:1px solid var(--line)">${balanceHTML(k,false)}</div>
    ${hevyOf(k).length?`<div class="wo" style="border-top:1px solid var(--line)">${workoutHTML(k)}</div>`:''}
    <div class="log" style="border-top:1px solid var(--line)">${has ? logHTML(k,false) : '<div class="empty" style="padding:22px">No hay nada registrado este día.</div>'}</div>
    <div style="padding:0 22px 22px"><button class="btn primary" style="width:100%" id="openDay">${has?'Editar este día':'Añadir comida a este día'}</button></div>`;
}

/* ---------- Navegación ---------- */
let viewBusy=false;
function movePill(v, instant){
  const seg=$('#viewSeg'), pill=seg.querySelector('.pill'), b=seg.querySelector(`button[data-view="${v}"]`);
  if (!pill||!b) return;
  if (instant) pill.style.transition='none';
  pill.style.width=b.offsetWidth+'px'; pill.style.transform=`translateX(${b.offsetLeft}px)`;
  if (instant){ void pill.offsetWidth; pill.style.transition=''; }
}
function resetReg(){
  if (!ui.reg) return;
  ui.reg=false; ui.sel=null; ui.step=1;
  $('#viewHoy').classList.remove('regmode'); $('#reg').classList.add('hidden'); $('#dash').classList.remove('hidden','slide-in-r','slide-in-l','q-in-r','q-in-l');
  renderRegBtn();
}
function setView(v, instant){
  if (viewBusy) return;
  const prev = ui.view;
  ui.view=v; document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  movePill(v, instant);
  const show = v==='hoy' ? $('#viewHoy') : $('#viewHist'), hide = v==='hoy' ? $('#viewHist') : $('#viewHoy');
  const render = ()=>{ if (v==='hist'){ ui.calSel = ui.date; const d=dateOf(ui.date); ui.month=new Date(d.getFullYear(),d.getMonth(),1); renderHist(); } else renderHoy(); };
  if (instant || prev===v || hide.classList.contains('hidden')){
    hide.classList.add('hidden'); show.classList.remove('hidden'); render(); window.scrollTo({top:0}); return;
  }
  viewBusy=true;
  const fwd = v==='hist', outCls = fwd ? 'leave-l' : 'leave-r';
  hide.classList.add(outCls);
  setTimeout(()=>{
    hide.classList.remove(outCls); hide.classList.add('hidden');
    render();
    show.classList.remove('hidden','slide-in-r','slide-in-l','q-in-r','q-in-l'); void show.offsetWidth;
    show.classList.add(fwd ? 'slide-in-r' : 'slide-in-l');
    window.scrollTo({top:0});
    setTimeout(()=>{ viewBusy=false; }, 300);
  }, 360);
}
function setDate(k){ ui.date=k; ui.sel=null; renderHoy(); }
function renderAll(){ ui.view==='hoy' ? renderHoy() : renderHist(); }

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.classList.contains('modal-bg')) return closeModal();
  const vb = t.closest('#viewSeg button'); if (vb) return setView(vb.dataset.view);
  if (t.closest('#settingsBtn') || t.closest('#goSettings')) return settingsModal();
  const mh = t.closest('.mhead'); if (mh && !mh.disabled){ const g = mh.closest('.mg'); ui.open = ui.open||{}; ui.open[g.dataset.mg] = !ui.open[g.dataset.mg]; g.classList.toggle('open'); return; }
  const tb = t.closest('#setTabs [data-tab]'); if (tb) return setTab(+tb.dataset.tab);
  if (t.closest('#regBtn')) return openReg(true);
  if (t.closest('#regBack')) return openReg(false);
  if (t.closest('#updHevy')){
    navigator.clipboard?.writeText('actualiza Hevy').catch(()=>{});
    window.open('https://claude.ai/code/project/chan_01XFw9Kpgt4sRfdnUJ7QQfZu?thread=cmsg_01XFw9Kpgt4sRfdnUJ7QQfZuLDXE13eQDL486oa2PWv5tW','_blank');
    ui.updNote=true; $('#wo').innerHTML = woCardHTML(ui.date); return; }
  if (t.closest('#copyUpd')){ navigator.clipboard?.writeText('actualiza Hevy'); toast('Copiado: actualiza Hevy'); return; }
  if (t.closest('#prevDay')) return setDate(addDays(ui.date,-1));
  if (t.closest('#nextDay')) return setDate(addDays(ui.date,1));
  if (t.closest('#todayBtn')) return setDate(todayKey());
  if (t.closest('#newProd')) return newProductModal();
  const mb = t.closest('[data-meal]'); if (mb){ ui.meal=mb.dataset.meal; return go(2,'fwd'); }
  const gb = t.closest('[data-group]'); if (gb){ ui.group=gb.dataset.group; return go(3,'fwd'); }
  const gt = t.closest('[data-goto]'); if (gt){ return go(+gt.dataset.goto,'back'); }
  const dc = t.closest('[data-delcustom]'); if (dc){ db.custom=db.custom.filter(p=>p.id!==dc.dataset.delcustom); db.recent=db.recent.filter(p=>p.id!==dc.dataset.delcustom); save(); renderGrid(); toast('Producto eliminado'); return; }
  const del = t.closest('[data-del]'); if (del){ const [m,j]=del.dataset.del.split(':'); dayData(ui.date)[m].splice(+j,1); save(); renderSide(); if (ui.step===1) renderPicker(); return; }
  if (t.closest('.addbtn')) return addEntry();
  const tile = t.closest('.tile[data-id]');
  if (tile){
    if (t.closest('.gbox')) return;
    const id = tile.dataset.id;
    if (ui.sel===id){ ui.sel=null; } else { ui.sel=id; ui.selGrams=null; ui.focusGrams=true; }
    renderGrid(); return;
  }
  if (t.closest('#prevMonth')){ ui.month=new Date(ui.month.getFullYear(), ui.month.getMonth()-1, 1); return renderHist(); }
  if (t.closest('#nextMonth')){ ui.month=new Date(ui.month.getFullYear(), ui.month.getMonth()+1, 1); return renderHist(); }
  if (t.closest('#thisMonth')){ const d=new Date(); ui.month=new Date(d.getFullYear(), d.getMonth(), 1); ui.calSel=todayKey(); return renderHist(); }
  const day = t.closest('[data-day]'); if (day){ ui.calSel=day.dataset.day; const d=dateOf(ui.calSel);
    if (d.getMonth()!==ui.month.getMonth()) ui.month=new Date(d.getFullYear(),d.getMonth(),1); return renderHist(); }
  if (t.closest('#openDay')){ ui.date=ui.calSel; ui.sel=null; ui.step=1; resetReg(); return setView('hoy'); }
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){ ui.q=e.target.value; ui.sel=null; renderGrid(); }
  if (e.target.dataset.act && e.target.closest('#wo')) setAct(e.target.dataset.act, e.target.value);
  if (e.target.classList.contains('gin')){
    ui.selGrams = e.target.value; const p = lookup.get(ui.sel), v = calc(p, qtyToGrams(p, +e.target.value||0));
    e.target.closest('.tile').querySelector('.calc').innerHTML = calcLine(v);
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.classList.contains('gin')){ e.preventDefault(); addEntry(); }
  else if (e.key==='Escape'){ if ($('#modalRoot').innerHTML) closeModal(); else if (ui.sel){ ui.sel=null; renderGrid(); } else if (ui.view==='hoy' && ui.reg){ if (ui.step>1) go(ui.step-1,'back'); else openReg(false); } }
});

renderHoy();
if ('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
movePill(ui.view||'hoy', true);
window.addEventListener('resize', ()=>movePill(ui.view||'hoy', true));
if (document.fonts) document.fonts.ready.then(()=>movePill(ui.view||'hoy', true));
</script>

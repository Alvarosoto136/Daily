<meta name="application-name" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Daily">
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#86868b; --line:#e8e8ed;
  --green:#34c759; --green-soft:#eafaf0; --blue:#0071e3;
  --prot:#ff375f; --carb:#0a84ff; --fat:#ff9f0a;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.78);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:24px}
.logo{font-weight:600;font-size:19px;letter-spacing:-.02em}
.logo span{color:var(--green)}
/* Pantalla de carga: calendario → punto → "Daily." */
#splash{position:fixed;inset:0;z-index:200;background:#f5f5f7;display:grid;place-items:center;animation:spOut .35s ease 2.3s forwards}
#splash .spg{display:flex;align-items:baseline;font-size:46px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
#splash .spw{display:inline-flex;justify-content:flex-end;overflow:hidden;white-space:nowrap;max-width:0;animation:spText .65s cubic-bezier(.22,.61,.36,1) 1.3s forwards}
#splash .spd{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:#ff3b30;transform:scale(9);animation:spDot .7s cubic-bezier(.4,0,.2,1) .8s forwards}
#splash .spdw{position:relative;display:inline-block;margin-left:.05em;line-height:0}
#splash .spcal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:1.2;display:grid;grid-template-columns:repeat(3,88px);grid-auto-rows:88px;place-items:center;font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--text);animation:fadeIn .15s ease both}
#splash .spcal .o{animation:spOther .45s ease .4s forwards}
#splash .spcal .c{color:#fff;font-weight:700;animation:spNum .25s ease .75s forwards}
@keyframes spDot{0%{transform:scale(9);background:#ff3b30}75%{transform:scale(1.3);background:#ff3b30}100%{transform:scale(1);background:var(--green)}}
@keyframes spOther{to{opacity:0;transform:scale(.7)}}
@keyframes spNum{to{opacity:0;transform:scale(.6)}}
@keyframes spText{from{max-width:0}to{max-width:3em}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px}
.seg button{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);transition:all .2s}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
html,body{overscroll-behavior:none}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none}
body{overflow-x:clip}
html,body,*{touch-action:pan-y}
#viewSeg{position:absolute;left:50%;transform:translateX(-50%)}
.top-in{position:relative}
#viewSeg button{position:relative;z-index:1}
#viewSeg button.on{background:transparent;box-shadow:none}
#viewSeg .pill{position:absolute;top:2px;bottom:2px;left:0;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transition:transform .5s cubic-bezier(.22,.61,.36,1),width .5s cubic-bezier(.22,.61,.36,1)}
.spacer{flex:1}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--muted);transition:background .2s}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--text)}

main{max-width:1240px;margin:0 auto;padding:28px 32px 110px}
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:20px}

/* Cabecera de día */
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.datecard{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px}
.datecard .dtxt{flex:1}
.datecard .round{box-shadow:none;background:var(--bg)}
.datecard .round:hover{background:#ebebef}
.datecard .dtxt{min-width:250px;text-align:center}
.datecard h1{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.datecard .sub{color:var(--muted);font-size:14px;margin-top:1px}
.datecard .pill{box-shadow:none;background:var(--bg);font-size:13px}
.btn-blue{flex:none;align-self:stretch;display:flex;align-items:center;gap:8px;background:#0071e3;color:#fff;font-size:16px;font-weight:600;
  padding:14px 28px;border-radius:20px;box-shadow:0 4px 14px rgba(0,113,227,.3);transition:transform .2s,background .2s,box-shadow .2s}
.btn-blue:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,113,227,.35)}
.btn-blue:active{transform:scale(.97)}
.btn-blue #regIco{font-size:18px;line-height:1}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto 1fr;gap:24px;align-items:start}
.dash .dcol:first-child{grid-row:1 / span 2}
.dash .dcol:nth-child(2){grid-column:2;grid-row:1}
.dash .dcol:nth-child(3){grid-column:2;grid-row:2}
.dcol{display:flex;flex-direction:column;gap:24px;min-width:0}
#summary{cursor:pointer;transition:box-shadow .2s}
#summary:active{box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.05)}
.sumtog{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.sumtog .chev{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--bg);transition:transform .35s cubic-bezier(.22,.61,.36,1)}
.det{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.det .regback{margin:0}
.dettitle{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:-60px;min-height:44px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.det #detSum{cursor:default}
.detmode .topbar{display:none}
@media (max-width:600px){ .dettitle{font-size:20px;margin-top:-54px;min-height:38px} }
.reg{max-width:920px;margin:0 auto;position:relative;padding-top:8px}
.regmode .topbar{display:none}
.fab{position:fixed;right:max(22px,calc(50vw - 620px + 22px));bottom:calc(26px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  background:#0071e3;color:#fff;display:grid;place-items:center;z-index:30;box-shadow:0 8px 24px rgba(0,113,227,.4),0 2px 6px rgba(0,0,0,.12);
  transition:transform .25s cubic-bezier(.22,.61,.36,1),opacity .2s,background .2s}
.fab:hover{background:#0077ed;transform:scale(1.06)}
.fab:active{transform:scale(.92)}
.fab.off{opacity:0;transform:scale(.6);pointer-events:none}
@media (max-width:600px){ .fab{right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px} }
.regback{display:grid;place-items:center;width:44px;height:44px;margin:0 0 14px}
.regback svg{display:block}
.reg .crumbs{justify-content:center;position:relative}
.reg .crumbs .steps{position:absolute;right:0}
.reg .crumbs>.round{position:absolute;left:0}
.slide-in-r{animation:inRs .8s cubic-bezier(.22,.61,.36,1) both}
.slide-in-l{animation:inLs .8s cubic-bezier(.22,.61,.36,1) both}
.leave-l{animation:outL .38s cubic-bezier(.55,0,.6,.4) both;pointer-events:none}
.leave-r{animation:outR .38s cubic-bezier(.55,0,.6,.4) both;pointer-events:none}
.fade-in{animation:fadeIn .8s cubic-bezier(.22,.61,.36,1) both}
@keyframes inRs{from{opacity:0;transform:translateX(40px)}}
@keyframes inLs{from{opacity:0;transform:translateX(-40px)}}
@keyframes outL{to{opacity:0;transform:translateX(-30px)}}
@keyframes outR{to{opacity:0;transform:translateX(30px)}}
@keyframes fadeIn{from{opacity:0}}
.q-in-r{animation:qInR .38s cubic-bezier(.22,.61,.36,1) both}
.q-in-l{animation:qInL .38s cubic-bezier(.22,.61,.36,1) both}
.q-out-l{animation:qOutL .16s ease-in both;pointer-events:none}
.q-out-r{animation:qOutR .16s ease-in both;pointer-events:none}
.q-fade{animation:fadeIn .38s ease both}
@keyframes qInR{from{opacity:0;transform:translateX(24px)}}
@keyframes qInL{from{opacity:0;transform:translateX(-24px)}}
@keyframes qOutL{to{opacity:0;transform:translateX(-16px)}}
@keyframes qOutR{to{opacity:0;transform:translateX(16px)}}
.wo .wempty{color:var(--muted);font-size:14px;padding:18px 0 6px;text-align:center}
.wo .wempty div{font-size:34px;margin-bottom:6px}
.wohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wohead h3{margin:0!important;font-size:17px!important}
.btn-upd{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#0071e3;background:#eaf3ff;padding:7px 12px;border-radius:999px}
.btn-upd:hover{background:#dcebff}
.updnote{font-size:13px;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;line-height:1.45}
.updnote code{background:#fff;border-radius:6px;padding:1px 6px;font-weight:600}
.updnote button{color:#0071e3;font-weight:600;margin-left:4px}
@media (max-width:600px){ .dash{grid-template-columns:1fr;grid-template-rows:none} .dash .dcol{grid-column:auto!important;grid-row:auto!important} .topbar{flex-direction:column;align-items:stretch} .datecard .dtxt{min-width:0;flex:1} }
.dayhead h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
.cap::first-letter{text-transform:uppercase}
.dayhead .sub{color:var(--muted);font-size:15px;margin-top:2px}
.nav-arrows{display:flex;gap:4px;margin-left:auto}
.pill{padding:7px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:14px;font-weight:500}
.pill:hover{background:#fafafa}
.round{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.round:hover{background:#fafafa}

/* Selector de comida */
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.meal{padding:16px 18px;border-radius:16px;background:#fff;box-shadow:var(--shadow);text-align:left;border:2px solid transparent;transition:all .2s}
.meal:hover{transform:translateY(-1px)}
.meal .mi{font-size:24px}
.meal .mn{font-weight:600;font-size:16px;margin-top:6px}
.meal .mk{color:var(--muted);font-size:13px;margin-top:2px}
.meal.on{border-color:var(--text);}

/* Buscador y categorías */
.searchbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(118,118,128,.12);border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;background:none;outline:none;padding:11px 0;font-size:15px}
.search span{color:var(--muted)}
.btn{padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;background:#fff;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.primary{background:var(--text);color:#fff;box-shadow:none}
.btn.primary:hover{background:#000}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;box-shadow:var(--shadow);white-space:nowrap;color:#424245}
.chip.on{background:var(--text);color:#fff}

.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 12px}

/* Recuadros de productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{position:relative;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:2px solid transparent;
  padding:16px;min-height:212px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;text-align:left}
.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.08)}
.tile .emo{font-size:40px;line-height:1;height:52px;display:flex;align-items:center}
.tile .emo img{width:52px;height:52px;object-fit:contain;border-radius:10px}
.tile .tn{font-weight:600;font-size:15px;margin-top:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tb{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tk{margin-top:auto;padding-top:10px;font-size:13px;color:var(--muted)}
.tile .tk b{color:var(--text);font-weight:600}
.tile .del-custom{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;color:var(--muted);font-size:14px;opacity:0}
.tile:hover .del-custom{opacity:1}
.tile .del-custom:hover{background:rgba(0,0,0,.06)}
.tile.sel{border-color:var(--green);box-shadow:0 0 0 4px rgba(52,199,89,.15),var(--shadow);cursor:default;transform:none}
.tile.sel .emo{font-size:28px;height:34px}
.tile.sel .emo img{width:34px;height:34px}
.tile.sel .tn{margin-top:6px;font-size:14px}
.gbox{margin-top:10px;display:flex;align-items:center;background:var(--green-soft);border-radius:10px;padding:0 10px}
.gbox input{width:100%;border:0;background:none;outline:none;font-size:20px;font-weight:600;padding:6px 0;-moz-appearance:textfield}
.gbox input::-webkit-outer-spin-button,.gbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gbox span{color:#248a3d;font-weight:600}
.calc{font-size:12px;color:var(--muted);margin-top:6px}
.calc b{color:var(--text)}
.addbtn{margin-top:10px;width:100%;padding:9px;border-radius:10px;background:var(--green);color:#fff;font-weight:600;font-size:14px}
.addbtn:hover{background:#2fb350}
.tile.new{border:2px dashed #d2d2d7;box-shadow:none;background:transparent;align-items:center;justify-content:center;color:var(--muted);gap:6px}
.tile.new:hover{border-color:var(--muted);color:var(--text)}
.tile.new .plus{font-size:30px;font-weight:300}
.empty{color:var(--muted);font-size:14px;padding:26px 0}
.offzone{margin-top:30px}
.spinner{width:18px;height:18px;border:2px solid #d2d2d7;border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pasos: momento > tipo > alimentos */
.picker{min-width:0;overflow:hidden;padding:4px 6px 20px;margin:-4px -6px 0}
.crumbs{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.crumbs h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.crumbs .path{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.crumbs .path button{font-weight:700;color:var(--muted);transition:color .2s}
.crumbs .path button:hover{color:var(--text)}
.crumbs .path i{color:#c7c7cc;font-style:normal;font-weight:400}
.steps{margin-left:auto;display:flex;gap:6px}
.steps span{width:7px;height:7px;border-radius:50%;background:#d2d2d7;transition:all .3s}
.steps span.on{background:var(--text);width:20px;border-radius:9px}
.stage.fwd{animation:qInR .34s cubic-bezier(.22,.61,.36,1) both}
.stage.back{animation:qInL .34s cubic-bezier(.22,.61,.36,1) both}
@keyframes inR{from{opacity:0;transform:translateX(60px)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}}
.bigs{display:grid;gap:16px}
.bigs.m3{grid-template-columns:repeat(3,1fr)}
.bigs.m5{grid-template-columns:repeat(5,minmax(0,1fr))}
.bigs.m5 .big{padding:22px 16px;min-height:190px}
.bigs.m5 .bn{font-size:18px}
.crumbs .path button:last-of-type{color:var(--text)}
.big{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;text-align:left;display:flex;flex-direction:column;
  min-height:210px;border:2px solid transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .2s}
.big:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 2px 4px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.1)}
.big:active{transform:scale(.98)}
.big .bi{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:var(--tint,#f5f5f7)}
.big .bn{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:auto;padding-top:18px}
.big .bs{font-size:13px;color:var(--muted);margin-top:3px}
.big.on{border-color:var(--text)}
.glist{overflow:hidden;padding:6px 0}
.grow{display:flex;align-items:center;gap:18px;width:100%;padding:14px 22px;text-align:left;transition:background .15s;position:relative}
.grow+.grow::before{content:"";position:absolute;top:0;left:88px;right:0;border-top:1px solid var(--line)}
.grow:hover{background:#fafafa}
.grow:active{background:#f2f2f4}
.grow .gi{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--tint,#f5f5f7);flex:none}
.grow .gn{flex:1;font-size:19px;font-weight:600;letter-spacing:-.01em}
.grow .gc{font-size:26px;color:#c7c7cc;font-weight:300;transition:transform .2s}
.grow:hover .gc{transform:translateX(3px);color:var(--muted)}
.foodbar{display:flex;gap:10px;margin-bottom:16px}

/* Resumen */
.summary{padding:24px}
.ringwrap{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:28px;font-weight:700;letter-spacing:-.03em}
.ring .c > span{font-size:12px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.22,.61,.36,1)}
.rest{font-size:14px;color:var(--muted);line-height:1.5}
.rest b{display:block;font-size:22px;color:var(--text);letter-spacing:-.02em}
.crea{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.crea b{margin-left:auto;font-weight:600}
.bal{padding:20px 22px}
.bal h3{font-size:15px;font-weight:600;margin-bottom:12px}
.bin{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bfield{display:flex;align-items:center;gap:8px;font-size:14px}
.bfield span{width:104px;flex:none;font-weight:500}
.bfield input,.bfield select{min-width:0;border:1px solid #d2d2d7;border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;outline:none}
.bfield input:focus,.bfield select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
label.bfield input{flex:1}
.bfield select{flex:1}
.bfield input[data-act=min]{width:72px;flex:none}
.bfield input:disabled{background:#f5f5f7;color:#c7c7cc}
.brows{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.brows div{display:flex;justify-content:space-between}
.brows b{color:var(--text);font-weight:500}
.brows .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;color:var(--text);font-weight:500}
.brows .tot b{font-weight:600}
.bres{margin-top:14px;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bres > span{font-size:14px;font-weight:600}
.bres b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bres.def{background:var(--green-soft);color:#248a3d}
.bres.sup{background:#fff4e5;color:#c93400}
.logtitle{font-size:17px;font-weight:600;padding:14px 22px 2px}
.bal h3{font-size:17px!important}
.bline{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bi2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.bi2.in{background:#eaf3ff}.bi2.out{background:#fff1eb}
.bl{flex:1;min-width:0;display:flex;flex-direction:column}
.bl b{font-size:14px;font-weight:600}
.bl small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.bv small{font-size:12px;font-weight:500;color:var(--muted)}
.bline+.bres{margin-top:14px!important}
.bout>.bres:first-child{margin-top:4px!important}
.agas{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--muted);white-space:nowrap}
.agas small{font-size:13px;font-weight:500}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bhead h3{margin:0!important}
.bnum{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.bnum small{font-size:14px;font-weight:500;color:var(--muted)}
.bnum.def{color:#248a3d}.bnum.sup{color:#c93400}
html.dark .bnum.def{color:#30d158}html.dark .bnum.sup{color:#ff9f0a}
.acal:empty{display:none}
.acal .bline:last-child{border-bottom:0}
.btiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btile{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.btile span{font-size:12px;font-weight:600;color:var(--muted)}
.btile b{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.btile small{font-size:12px;color:var(--muted)}
.btile.in{background:#eaf3ff}.btile.in b{color:#0a64c9}
.btile.out{background:#fff1eb}.btile.out b{color:#d9480f}
.bres{margin-top:10px!important}
.brows .bh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 2px}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.wtype{white-space:nowrap;display:inline-block;font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:3px 10px;background:#8e8e93}
.wsteps{cursor:text;margin-bottom:10px}
.wtype.pasos{background:#5e5ce6}
.wsteps input{width:110px;margin-left:auto;border:1px solid #d2d2d7;border-radius:10px;padding:8px 10px;font-size:17px;font-weight:600;text-align:right;background:#fff;outline:none;-moz-appearance:textfield}
.wsteps input::-webkit-outer-spin-button,.wsteps input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wsteps input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.wsteps .wkc{min-width:52px}
.wtype.push{background:#ff375f}.wtype.pull{background:#0a84ff}.wtype.hombro{background:#ff9f0a}
.wname{font-size:15px;font-weight:600;margin-left:8px}
.wtop .wmeta{margin:6px 0 0}
.wkc{text-align:right;line-height:1}
.wkc b{font-size:26px;font-weight:700;letter-spacing:-.03em;color:#d9480f}
.wkc small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.wrow{padding:8px 2px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wn2{font-size:13px;font-weight:600}
.ws2{font-size:12px;color:var(--muted);margin-top:2px}
.ws2 b{color:var(--text);font-weight:600}
.bsep{border-top:1px solid var(--line);margin:16px 0 14px}
.wo h3.wtitle{font-size:15px;margin-top:4px}
.bnote{font-size:13px;color:var(--muted);margin-bottom:10px}
.link{color:var(--blue);font-weight:500}
.wo{padding:20px 22px}
.sleep{padding:20px 22px}
.sleep h3{font-size:17px;font-weight:600;margin-bottom:12px}
.slrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slbox{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.slbox span{font-size:12px;color:var(--muted);font-weight:500}
.slbox input.bad{color:#ff3b30}
.slbox input::placeholder{color:#c7c7cc}
.slbox input{border:0;background:transparent;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text);outline:0;padding:0;width:100%;font-family:inherit}
.slout{margin-top:14px}
.slres{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}

.mrow .ml{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}

.mhead{display:flex;align-items:center;gap:10px;width:100%;padding:13px 22px;text-align:left}

/* Historial */
.hist{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.cal{padding:26px}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dc{aspect-ratio:1/0.92;border-radius:14px;padding:10px;display:flex;flex-direction:column;text-align:left;transition:background .15s;border:2px solid transparent;background:#fff}

.stats{margin-top:18px}
.legend span{display:flex;align-items:center;gap:6px}

.stat{background:var(--bg);border-radius:14px;padding:14px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:#424245}
.field{min-width:0}

.modal{max-height:calc(100vh - 40px);overflow-y:auto}

.mres{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mwarn{grid-column:1/-1;font-size:13px;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.seg.tabs{display:flex;width:100%;margin-bottom:22px}

.tabp.fwd{animation:inR .4s cubic-bezier(.2,.8,.2,1)}

.modal{overflow-x:hidden}

.tmb{font-size:13px;color:var(--muted);margin:-4px 0 6px;min-height:18px}

.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.mlinks{display:flex;gap:10px;margin-top:12px}
.mcell b{white-space:nowrap}
@media (max-width:600px){ .mcell{gap:6px} .mcell span{font-size:12px} }
.avwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px}
.av{width:92px;height:92px;border-radius:50%;background:var(--bg);color:#aeaeb2;display:grid;place-items:center;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.av b{font-size:38px;font-weight:600;color:var(--text)}

.avlink{background:none;border:0;padding:0;font:inherit;font-size:14px;font-weight:500;color:#007aff;cursor:pointer}
.avlink.red{color:#ff3b30}
.prow .pv input.pname{width:170px;font-weight:500}
.plist{background:var(--bg);border-radius:14px;margin-top:16px;overflow:hidden}

.prow:last-child{border-bottom:0}
.plist+.tmb{margin-top:12px;padding:0 4px}
.prow>span:first-child{font-size:15px;font-weight:500}
.prow .pv{display:flex;align-items:center;gap:6px}
.prow .pv input{width:80px;border:0;background:transparent;text-align:right;font-size:16px;font-weight:600;padding:6px 0;outline:0;-moz-appearance:textfield}
.prow .pv input::-webkit-outer-spin-button,.prow .pv input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.prow .pv em{font-style:normal;color:var(--muted);font-size:14px;min-width:30px}
.prow select{border:0;background:transparent;font-size:15px;font-weight:600;text-align:right;text-align-last:right;padding:6px 0;outline:0;max-width:60%;cursor:pointer}
.prow .sexseg{width:auto;flex:none}
.prow .sexseg span{padding:6px 14px}
.ssep{height:1px;background:var(--line);margin:22px 0 18px}
.modal h3.sh{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.965)}}
@keyframes popOut{to{opacity:0;transform:translateY(8px) scale(.975)}}
@keyframes fadeOut{to{opacity:0}}
.modal-bg{animation:fade .24s ease both!important}
.modal{animation:pop .3s cubic-bezier(.22,.61,.36,1) both!important;will-change:transform,opacity}
.modal-bg.out{animation:fadeOut .18s ease forwards!important;pointer-events:none}
.modal-bg.out .modal{animation:popOut .18s ease forwards!important}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.92);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Ajustes: subpestañas y apariencia */

.slist{margin-top:0;margin-bottom:16px}
.prow.nav{width:100%;text-align:left;cursor:pointer;gap:12px;justify-content:flex-start}

.sic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;font-style:normal;flex:none}

<script>

(function(){
  const t=new Date(), cal=document.getElementById('spcal'), off=[-8,-7,-6,-1,0,1,6,7,8];
  cal.innerHTML = off.map(o=>{ const d=new Date(t); d.setDate(t.getDate()+o); return `<span class="${o===0?'c':'o'}">${d.getDate()}</span>`; }).join('');
})();
</script>

// Re-renderiza y anima barras, anillo y números desde su valor anterior
function animSwap(fn){
  const pw={}, pn={};
  $('#viewHoy').querySelectorAll('[data-a]').forEach(e=>{ pw[e.dataset.a] = e.style.width || e.style.strokeDashoffset; });
  $('#viewHoy').querySelectorAll('[data-n]').forEach(e=>{ pn[e.dataset.n] = +e.dataset.v; });
  fn();
  const els = [...$('#viewHoy').querySelectorAll('[data-a]')].filter(e=>pw[e.dataset.a]!=null);
  const tgt = els.map(e=>{ const ring = e.tagName.toLowerCase()==='circle'; const t = ring ? e.getAttribute('stroke-dashoffset') : e.style.width;
    e.style.transition='none'; if (ring) e.style.strokeDashoffset = pw[e.dataset.a]; else e.style.width = pw[e.dataset.a]; return [e,ring,t]; });
  if (els.length){ void document.body.offsetWidth;
    tgt.forEach(([e,ring,t])=>{ e.style.transition=''; if (ring) e.style.strokeDashoffset = /px$/.test(t)?t:t+'px'; else e.style.width = t; }); }
  $('#viewHoy').querySelectorAll('[data-n]').forEach(e=>{
    const from = pn[e.dataset.n], to = +e.dataset.v, f = FMT[e.dataset.f]||fk;
    if (from==null || from===to) return;
    const t0 = performance.now(), D = 900;
    const step = now=>{ if (!e.isConnected) return; const x = Math.max(0,Math.min(1,(now-t0)/D)), ease = 1-Math.pow(1-x,3);
      e.textContent = f(from + (to-from)*ease); if (x<1) requestAnimationFrame(step); };
    e.textContent = f(from); requestAnimationFrame(step);
  });
}

const GYM = [
  {id:'',        name:'Sin gimnasio', met:0},
  {id:'fuerza',  name:'Fuerza (pesas)', met:5},
  {id:'fuerzai', name:'Fuerza intensa', met:6},

  {id:'hiit',    name:'HIIT / cardio intenso', met:8},
];
const nf2 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
/* ---------- Gasto del entreno, serie a serie ----------
   Para cada repetición: trabajo mecánico = carga efectiva × g × recorrido (m).
   · carga efectiva = peso de la serie (×2 en mancuernas a dos brazos) + la parte de tu peso corporal que mueve el ejercicio
     (dominada ≈ 95 %, fondos ≈ 90 %, sentadilla ≈ 85 %, flexión ≈ 65 %…; en máquinas y poleas, 0 %).
   · el músculo convierte ~20 % de la energía en trabajo; la fase excéntrica y la estabilización suman ~30 % más.
   Además: esfuerzo isométrico durante cada serie (~3 s por repetición, 3 MET netos), descansos entre series
   (resto de la duración del entreno, 1,5 MET netos) y post-quemado (EPOC, +15 %).
   Todo es gasto NETO por encima del metabolismo basal, que ya se cuenta aparte. */
const EX = [
  // [patrón, recorrido m, fracción del peso corporal, nombre del tipo]
  [/dominada|pull ?up|chin ?up/,                 0.60, 0.95, 'tirón con peso corporal'],
  [/fondo|dip/,                                  0.45, 0.90, 'empuje con peso corporal'],
  [/flexion|push ?up/,                           0.35, 0.65, 'empuje con peso corporal'],
  [/sentadilla|squat/,                           0.60, 0.85, 'pierna compuesto'],
  [/zancada|lunge|bulgara|split/,                0.50, 0.85, 'pierna compuesto'],
  [/peso muerto|deadlift/,                       0.55, 0.40, 'cadena posterior'],
  [/prensa|leg press|hack/,                      0.50, 0.10, 'pierna en máquina'],
  [/hip thrust|puente/,                          0.30, 0.30, 'glúteo'],
  [/gemelo|pantorrilla|calf/,                    0.10, 0.85, 'gemelo'],
  [/extension de pierna|cuadriceps|leg extension/,0.45,0,   'pierna aislado'],
  [/curl femoral|isquio|leg curl/,               0.40, 0,    'pierna aislado'],
  [/press de banca|bench|press inclinado|press declinado/, 0.45, 0, 'empuje compuesto'],
  [/press de pecho|chest press/,                 0.40, 0,    'empuje en máquina'],
  [/mariposa|pec deck|apertura|cruce|fly/,       0.35, 0,    'pecho aislado'],
  [/press de hombro|press militar|overhead|arnold/, 0.50, 0, 'empuje vertical'],
  [/elevacion lateral|elevacion frontal|pajaro|lateral raise/, 0.45, 0, 'hombro aislado'],
  [/tiron a la cara|face pull/,                  0.40, 0,    'hombro posterior'],
  [/jalon|pulldown/,                             0.60, 0,    'tirón vertical en polea'],
  [/remo|row/,                                   0.40, 0,    'tirón horizontal'],
  [/curl/,                                       0.35, 0,    'bíceps'],
  [/frances|triceps|skull|extension/,            0.35, 0,    'tríceps'],
  [/abdominal|crunch|encogimiento/,              0.20, 0.30, 'core'],
];
function exInfo(name){ const n = norm(name);
  const m = EX.find(([re])=>re.test(n)) || [null, 0.40, 0, 'general'];
  const dbl = /mancuerna|dumbbell/.test(n) && !/un brazo|unilateral|una mano|alterno/.test(n);
  return {rom:m[1], bw:m[2], tipo:m[3], dbl}; }
// Intensidad (RIR = repeticiones en reserva). Ir al fallo (RIR 0):
//  · las últimas repeticiones son más lentas → más tiempo bajo tensión (3 s → 3,6 s por rep.)
//  · se reclutan más fibras y la eficiencia cae por la fatiga → +15 % de coste por repetición
//  · más trabajo anaeróbico → más esfuerzo durante la serie (3 → 4,5 MET netos) y más post-quemado (12 % → 24 %)
function rirFx(rir){ const f = 3 - Math.min(3, Math.max(0, +rir||0));   // 3 = fallo, 0 = RIR 3 o más
  return {tempo: 3 + 0.2*f, mech: 1 + 0.05*f, met: 3 + 0.5*f, epoc: 0.12 + 0.04*f}; }
function workoutKcal(w, peso, rir){
  peso = peso || 75; let mech = 0, reps = 0; const porEj = [];
  const F = rirFx(rir ?? (db.profile||{}).rir ?? 0);
  for (const [name, sets] of w.ejercicios){
    const x = exInfo(name); let e = 0;
    for (const [kg, r] of sets){
      const carga = (+kg||0) * (x.dbl?2:1) + x.bw * peso;
      e += r * carga * 9.81 * x.rom * 1.3 * F.mech / (0.20 * 4184); reps += r;
    }
    const activo = sets.reduce((t,[,r])=>t+r,0) * F.tempo / 3600 * F.met * peso;   // esfuerzo isométrico durante la serie
    porEj.push({name, tipo:x.tipo, kcal:e+activo}); mech += e;
  }
  const activoH = reps*F.tempo/3600, esfuerzo = F.met*peso*activoH;
  const descanso = 1.5 * peso * Math.max(0, w.min/60 - activoH);
  const base = mech + esfuerzo + descanso, epoc = base*F.epoc;
  return {mech, esfuerzo, descanso, epoc, total: base+epoc, porEj};
}
function hevyOf(k){ return (window.HEVY||[]).filter(w=>w.fecha===k); }
function fmtMin(m){ const h=Math.floor(m/60), r=m%60; return h ? `${h} h ${r} min` : `${r} min`; }
// Tipo de entreno: Push / Pull / Hombro (por el nombre o, si no, por los ejercicios)
function woType(w){
  const n = norm(w.nombre);
  if (/hombro|shoulder/.test(n)) return 'Hombro'; if (/push|empuje/.test(n)) return 'Push'; if (/pull|tiron|espalda/.test(n)) return 'Pull';
  let c = {Push:0, Pull:0, Hombro:0};
  for (const [name] of w.ejercicios){ const e = norm(name);
    if (/press de hombro|press militar|overhead|arnold|elevacion lateral|elevacion frontal|pajaro|tiron a la cara|face pull/.test(e)) c.Hombro++;
    else if (/remo|jalon|pulldown|dominada|curl|pullover/.test(e)) c.Pull++;
    else c.Push++; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
function setsTxt(ss){
  // Agrupa series consecutivas con el mismo peso: "40 kg × 6 / 35 kg × 8 · 8 · 7"
  const gs=[]; for (const [kg,r] of ss){ const l=gs[gs.length-1]; if (l && l.kg===kg) l.r.push(r); else gs.push({kg,r:[r]}); }
  return gs.map(g=>`<b>${nf2.format(g.kg)} kg</b> × ${g.r.join(' · ')}`).join(' <span class="wsep">/</span> ');
}
function workoutHTML(k){
  const ws = hevyOf(k); if (!ws.length) return '';
  const peso = +(db.profile||{}).peso || 75;
  return ws.map(w=>{ const K = workoutKcal(w, peso), t = woType(w);
    return `<div class="wtop"><div><span class="wtype ${t.toLowerCase()}">${t}</span>${norm(w.nombre)!==norm(t)?`<span class="wname">${esc(w.nombre)}</span>`:''}

function balanceCalc(k){
  const P = db.profile||{}, peso = +P.peso, b = bmr(P), a = actOf(k), ing = totals(k).k;
  if (!b) return {ok:false, ing};

async function bcLookup(code){

    const j = r.ok ? await r.json() : null, pr = j && j.status===1 && j.product;
    const n = pr && pr.nutriments || {};
    const kc = n['energy-kcal_100g']!=null ? +n['energy-kcal_100g'] : (n.energy_100g!=null ? +n.energy_100g/4.184 : null);
    const vals = {k:kc, p:n.proteins_100g, c:n.carbohydrates_100g, g:n.fat_100g};

  finally { $('#bcBtn')?.classList.remove('busy'); }

function imgToB64(file, max){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onerror=ko; r.onload=()=>{ const im=new Image(); im.onerror=ko; im.onload=()=>{ const k=Math.min(1, max/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); ok(cv.toDataURL('image/jpeg',.88).split(',')[1]); }; im.src=r.result; }; r.readAsDataURL(file); }); }

function avResize(file){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onerror=ko; r.onload=()=>{ const im=new Image(); im.onerror=ko; im.onload=()=>{ const S=320, s=Math.min(im.width,im.height), cv=document.createElement('canvas'); cv.width=cv.height=S; cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S); ok(cv.toDataURL('image/jpeg',.85)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

// Objetivos: proteína y grasa por kilo; hidratos = resto de calorías
function macroCalc(peso, kcal, pkg, gkg){ if(!peso||!kcal) return null;
  const p=peso*pkg, g=peso*gkg, c=(kcal - p*4 - g*9)/4; return {p, g, c, cr:peso/10}; }

  document.querySelectorAll('.subp').forEach(pn=>{ const show = +pn.dataset.s===n; pn.classList.toggle('hidden', !show);

// Metabolismo basal (fórmula de Mifflin-St Jeor)
function bmr(f){ const w=+f.peso, h=+f.altura, a=+f.edad; if(!w||!h||!a||!f.sexo) return 0;
  return 10*w + 6.25*h - 5*a + (f.sexo==='hombre' ? 5 : -161); }

function renderHist(){

  $('#calTitle').textContent = new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(m);
  const start = new Date(y,mo,1); start.setDate(1 - ((start.getDay()+6)%7));
  const t = todayKey(); let html=''; const logged=[];
  for (let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const k=keyOf(d);
    if (i>=35 && d.getMonth()!==mo) break;
    const tt = totals(k), has = tt.k>0;
    if (has && d.getMonth()===mo) logged.push(tt);
    const any = has || hevyOf(k).length>0 || sleepMin(sleepOf(k))!=null || +(actOf(k).pasos||0)>0;
    html += `<button class="dc ${d.getMonth()!==mo?'out':''} ${k===t?'today':''} ${any?'has':''} ${k===ui.calSel?'sel':''}" data-day="${k}"><span class="dn">${d.getDate()}</span></button>`;

    <div class="stat"><b>${fk(avg('k'))}</b><span>kcal de media</span></div>`;

}

function aiMd(s){ const L = esc(s).split('\n'); let out='', list='';
  const inl = x => x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  const close = () => { if (list){ out += `</${list}>`; list=''; } };
  L.forEach(l => { let m;
    if ((m = l.match(/^\s*[-•*]\s+(.*)/))){ if (list!=='ul'){ close(); out+='<ul>'; list='ul'; } out += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if (list!=='ol'){ close(); out+='<ol>'; list='ol'; } out += `<li>${inl(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))){ close(); out += `<p><b>${inl(m[1])}</b></p>`; }
    else if (l.trim()){ close(); out += `<p>${inl(l)}</p>`; } else close(); });
  close(); return out; }
function aiContext(){
  const P=db.profile||{}, G=db.goal, t=todayKey(), f1=v=>Math.round(+v||0);
  const lines = [];
  lines.push(`Fecha de hoy: ${fmtDay(t)} (${t}).`);
  lines.push(`Perfil: ${P.nombre?'nombre '+P.nombre+', ':''}${P.sexo||'sexo sin indicar'}, ${P.edad||'?'} años, ${P.altura||'?'} cm, ${P.peso||'?'} kg. Entrena con intensidad RIR ${P.rir??0}.`);
  lines.push(`Objetivos diarios: ${G.k} kcal, proteína ${G.p} g, carbohidratos ${G.c} g, grasa ${G.g} g.`);
  const b = bmr(P); if (b) lines.push(`Metabolismo basal estimado: ${f1(b)} kcal.`);
  lines.push('Últimos 7 días (de más antiguo a hoy):');
  for (let i=6;i>=0;i--){ const k=addDays(t,-i), tt=totals(k), sl=sleepMin(sleepOf(k)), a=actOf(k), hv=hevyOf(k), bal=balanceCalc(k);
    const bits=[tt.k ? `${k}: ${f1(tt.k)} kcal, P ${f1(tt.p)} g, C ${f1(tt.c)} g, G ${f1(tt.g)} g` : `${k}: sin comida registrada`];
    if (+a.pasos) bits.push(`${a.pasos} pasos`);
    if (sl!=null) bits.push(`sueño ${fmtHM(sl)}`);
    if (hv.length) bits.push('entreno: '+hv.map(w=>`${woType(w)}${w.nombre&&norm(w.nombre)!==norm(woType(w))?' «'+w.nombre+'»':''} ${w.min} min (${(w.ejercicios||[]).map(e=>Array.isArray(e)?`${e[0]} ${(e[1]||[]).map(s=>s[0]+'kg×'+s[1]).join(' ')}`:(e.nombre||'')).filter(Boolean).join('; ')})`).join('; '));
    if (bal.ok && tt.k) bits.push(`balance ${f1(bal.diff)} kcal`);
    lines.push('- '+bits.join(', ')); }
  const d=dayData(t), items=[];
  MEALS.forEach(m => (d[m.id]||[]).forEach(e => items.push(`${m.name}: ${e.prod.n} ${f1(e.grams)} g`)));
  lines.push(items.length ? 'Comido hoy: '+items.join('; ')+'.' : 'Hoy aún no ha registrado comida.');
  const foods=[...db.custom, ...BASE].map(p=>`${p.n} (${p.k} kcal, P ${p.p}, C ${p.c}, G ${p.g} por 100 g)`);
  lines.push('Alimentos que tiene en su app: '+foods.join('; ')+'.');
  return lines.join('\n');
}

Responde siempre en español de España, cercano y directo. Sé breve: unas pocas frases o una lista corta, salvo que te pida más detalle. Usa sus datos cuando sirvan para concretar la respuesta (por ejemplo, cuánta proteína le falta hoy), sin repetirlos todos.
No eres médico ni dietista: ante dolor, lesiones, síntomas, medicación o trastornos de la conducta alimentaria, dile que consulte a un profesional.

Sus datos de Daily:
${aiContext()}`; }

async function aiAsk(q){
  q=(q||'').trim(); if (!q || AI.busy) return;
  AI.msgs.push({role:'user', content:q}); const ans={role:'assistant', content:''}; AI.msgs.push(ans); AI.busy=true;

  const hist = AI.msgs.filter(m=>!m.err && m!==ans && m.content).slice(-20).map(m=>({role:m.role, content:m.content}));
  while (hist.length && hist[0].role!=='user') hist.shift();
  try {
    const {sdk, c} = await aiClient();
    const stream = c.beta.messages.stream({ model:'claude-opus-5-5', max_tokens:4000,
      betas:['server-side-fallback-2026-07-01'], fallbacks:'default', output_config:{effort:'low'},
      system: aiSystem(), messages: hist });
    for await (const ev of stream){
      if (ev.type==='content_block_delta' && ev.delta.type==='text_delta'){ ans.content += ev.delta.text; const live=$('#aiLive'); if (live){ live.innerHTML=aiMd(ans.content); const b=$('#aiBody'); if (b.scrollHeight-b.scrollTop-b.clientHeight<140) b.scrollTop=b.scrollHeight; } }

      : (S.PermissionDeniedError && err instanceof S.PermissionDeniedError) ? 'Tu clave no tiene permiso para usar este modelo.'
      : (S.RateLimitError && err instanceof S.RateLimitError) ? 'Demasiadas preguntas seguidas. Espera un momento y vuelve a probar.'
      : (S.APIConnectionError && err instanceof S.APIConnectionError) || !navigator.onLine ? 'No hay conexión. Revisa internet y vuelve a probar.'
      : (S.APIError && err instanceof S.APIError && /credit|billing/i.test(err.message||'')) ? 'Tu cuenta de API no tiene saldo. Añade crédito en console.anthropic.com.'
      : 'Algo ha fallado: '+(err && err.message ? err.message : err);
  }
  AI.busy=false; aiSaveChat(); aiRender();
}
